name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack project
        run: |
          mkdir -p proj
          Z=$(find . -name InkVideoMaker.zip -not -path './proj/*' | head -1)
          if [ -n "$Z" ]; then unzip -q -o "$Z" -d proj; else cp -r . proj/; fi
      - name: Build
        run: |
          S=$(find proj -name settings.gradle.kts | head -1)
          cd "$(dirname "$S")" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: proj/**/app/build/outputs/apk/debug/app-debug.apk
